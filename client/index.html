<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox 2.0</title>
  <link rel="stylesheet" href="/styles.css" />
  <!--
    Three.js is loaded via import map. For the packaged desktop build run
    `node desktop/vendor.js` to copy three into /client/vendor and the import
    map below is rewritten to point at the local copy (fully offline).
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-host"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
