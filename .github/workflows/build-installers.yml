name: Build Installers

# Produces real native installers on each OS's runner:
#   • Windows .exe (NSIS)   • macOS .dmg   • Linux .AppImage + .deb
# Run manually (Actions tab → Run workflow) or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: macos-latest
            target: dist:mac
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Vendor three.js (offline build)
        working-directory: desktop
        run: node vendor.js

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: roblox2-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    # When a tag is pushed, attach all installers to a GitHub Release.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
