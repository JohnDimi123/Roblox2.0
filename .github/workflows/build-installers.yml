name: Build Installers

# Produces real native installers on each OS's runner:
#   • Windows .exe (NSIS)   • macOS .dmg   • Linux .AppImage + .deb
# Run manually (Actions tab → Run workflow) or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
          - os: macos-latest
            target: dist:mac
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Vendor three.js (offline build)
        working-directory: desktop
        run: node vendor.js

      - name: Build installer
        working-directory: desktop
        run: npm run ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: roblox2-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    # Attach all installers to a GitHub Release (downloadable from github.com).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Roblox 2.0 v1.0.0
          body: |
            Roblox 2.0 installers — pick your platform:
            • Windows: Roblox2.0-Setup-1.0.0.exe
            • macOS: Roblox2.0-1.0.0.dmg
            • Linux: Roblox2.0-1.0.0.AppImage / .deb
          files: artifacts/**/*
